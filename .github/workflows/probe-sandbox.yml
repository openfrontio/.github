# Temporary probe for the fork-mode review failure (bwrap: Can't mkdir parents
# for /run/containerd/containerd.sock). Delete once the cause is fixed.
name: probe-sandbox
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Host state
        run: |
          set -x
          ls -la /run/containerd /run/docker.sock 2>&1 || true
          systemctl is-active docker containerd 2>&1 || true
          command -v bwrap || true
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>&1 || true
      - name: Install isolation deps (as the action does)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat
      - name: Host state after install
        run: |
          ls -la /run/containerd /run/docker.sock 2>&1 || true
          systemctl is-active docker containerd 2>&1 || true
      - name: bwrap masking test
        run: |
          set -x
          bwrap --ro-bind / / --dev /dev --proc /proc --ro-bind /dev/null /run/containerd/containerd.sock -- /bin/true; echo "mask existing: $?"
          bwrap --ro-bind / / --dev /dev --proc /proc --ro-bind /dev/null /run/nonexistent-dir/x.sock -- /bin/true; echo "mask missing parent: $?"
